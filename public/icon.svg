<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FC5200" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#232C3D" stroke-width="4" />

  <!-- Geometric route/pulse silhouette -->
  <g filter="url(#glow)">
    <path d="M 96 290 L 160 290 L 210 160 L 260 360 L 310 220 L 350 290 L 416 290" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- High-contrast waypoint marker -->
  <circle cx="210" cy="160" r="14" fill="#FFFFFF" />
  <circle cx="416" cy="290" r="16" fill="#FF5500" stroke="#FFFFFF" stroke-width="6" />
</svg>
